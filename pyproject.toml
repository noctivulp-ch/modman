[project]
name = "modman"
version = "0.1.0"
description = "Gestión del índice de mods de un modpack: un índice en git, N destinos, CLI para agentes y TUI para humanos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "noctivulp-ch" }]
keywords = ["minecraft", "modpack", "mods", "modrinth", "tui", "cli"]

# El núcleo y la CLI no necesitan nada fuera de la biblioteca estándar: se usan en repos
# ajenos y en CI, donde cada dependencia es una razón más para que no arranque.
dependencies = []

[project.optional-dependencies]
tui = ["textual>=8.2,<9", "rich>=13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual>=8.2,<9"]

[project.scripts]
modman = "modman.cli.main:main"
modman-tui = "modman.tui.app:main"

[project.gui-scripts]
# Vacío a propósito: la TUI no es una app de escritorio, se lanza desde la terminal.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
